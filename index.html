<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Менің қосымшам</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    main {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000012;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #result { margin-top: 18px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 Менің қосымшам</h1>
    <p>Android · iPhone · Компьютер</p>
  </header>
  <main>
    <section class="card">
      <h2>Қош келдің!</h2>
      <p>Атыңды енгізіп, батырманы бас.</p>
      <input id="name" type="text" placeholder="Атыңды жаз">
      <button onclick="greet()">Бастау</button>
      <div id="result"></div>
    </section>
  </main>
  <script>
    function greet() {
      const name = document.getElementById('name').value.trim();
      const result = document.getElementById('result');
      if (!name) {
        result.textContent = 'Алдымен атыңды жаз!';
        return;
      }
      result.textContent = 'Сәлем, ' + name + '! Қосымшаға қош келдің!';
    }
  </script>
</body>
</html>
